name: Build Pepinillo Rick APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Se necesitan permisos de escritura para que 
    # el bot de GitHub Actions pueda crear el Release
    permissions:
      contents: write 

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x ./gradlew

      - name: Compilar el módulo platform
        run: ./gradlew :platform:assembleDebug --no-configuration-cache

      - name: Compilar el APK (Debug)
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Crear GitHub Release y subir APK
        uses: softprops/action-gh-release@v2
        with:
          # Genera un tag dinámico basado en el número de ejecución del Action
          tag_name: v1.0.${{ github.run_number }}
          name: "Compilación de Pruebas v1.0.${{ github.run_number }}"
          # Mensaje descriptivo con el hash del commit que disparó el action
          body: "APK de Debug generado automáticamente a partir del commit: ${{ github.sha }}"
          # Ruta directa al archivo que queremos subir
          files: app/build/outputs/apk/debug/app-debug.apk
